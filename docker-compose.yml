services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kfw-escape:latest
    container_name: kfw-escape
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_FILE: /app/data/kfw-escape.sqlite
      # Public URL players reach, used for QR codes and join links.
      #
      # Leer ist die richtige Vorgabe: Dann baut der Server Join-Link und
      # QR-Code aus der Adresse, unter der die Seite tatsaechlich aufgerufen
      # wurde. Stand hier localhost, zeigte der QR-Code hinter einem Tunnel auf
      # den Rechner der Spielleitung - fuer alle anderen ins Leere. Nur setzen,
      # wenn ein Proxy davor den Host-Header nicht durchreicht.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Game master login. Empty means no login (host secret bound to the
      # browser that created the session).
      HOST_PASSWORD: ${HOST_PASSWORD:-}
      HOST_LOGIN_RATE_LIMIT: ${HOST_LOGIN_RATE_LIMIT:-10}
      SESSION_RATE_LIMIT: ${SESSION_RATE_LIMIT:-10}
      JOIN_RATE_LIMIT: ${JOIN_RATE_LIMIT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - escape-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cloudflare-Connector, nur mit Profil: `docker compose --profile tunnel up -d`
  #
  # Braucht ausser dem Token nichts. Der Connector steht im selben Netz wie die
  # App und erreicht sie unter `http://app:3001` - genau das gehoert im
  # Cloudflare-Dashboard als Service des Public Hostname eingetragen. Kein
  # offener Port im LAN, keine IP, die sich aendern kann.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kfw-escape-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  escape-data:
