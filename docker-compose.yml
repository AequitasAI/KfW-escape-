services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kfw-escape:latest
    container_name: kfw-escape
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_FILE: /app/data/kfw-escape.sqlite
      # Public URL players reach, used for QR codes and join links.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - escape-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  escape-data:
